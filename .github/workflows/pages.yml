# Publishes the site to GitHub Pages, so a link is enough to play the game.
#
# Two things go up: the hand-written landing page from site/ at the root, and
# the Flutter build under play/. The landing page is where someone finds out
# what the game is and which keys move them, because the game itself has no
# menu and says nothing.
#
# The campaign is what gets built, not the Phase 1 walker: a link handed to
# someone is a link to the game.
#
# The bench goes up too, under lab/, and nothing links to it. It is there so a
# level can be sent to the gate from a browser (Phase 8.3) — the owner's tool,
# not something for players: its sliders only invite fiddling with numbers the
# levels are measured against, which is why the landing page never mentions it
# and the page asks search engines to leave it out. It reads levels/ as it was
# at build time (WARAYA_LEVELS=bundled), since a browser has no folder to read.
#
# THIS WORKFLOW ONLY PUBLISHES IF PAGES IS SET TO DEPLOY FROM ACTIONS.
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#
# It is a repository setting and nothing in this file can change it. With the
# other setting — "Deploy from a branch" — GitHub runs its own Jekyll build on
# every push as well, and that build renders README.md at the root, knows
# nothing about site/, and has no game to put under play/. Both deployments
# then race: this one finished at 22:32:12 and Jekyll's at 22:32:17, so the
# README won and the site looked like a repository page for twelve pushes,
# with every run of this workflow green. `configure-pages` with `enablement`
# turns Pages *on*; it does not move an already-configured source.
name: pages

on:
  push:
    branches: [main]
  # So a deploy can be forced without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A running one is left to finish rather than cancelled —
# cancelling mid-deploy is how a half-published site happens.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # All of history and the tags: latest.json's notes are the commits
      # since the last release when nobody wrote any (tool/latest_json.sh).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          # Same pin as checks.yml and .fvmrc.
          flutter-version: 3.44.9
          channel: stable
          cache: true

      # `enablement` turns Pages on the first time this runs, so the repository
      # settings never have to be touched by hand.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - run: flutter pub get

      # WebAssembly (--wasm): a browser that can run it gets the dart2wasm
      # build and the skwasm renderer — measured, 2.4 MB compressed to the
      # first frame against 3.0 MB for dart2js and CanvasKit — and one that
      # cannot (an older Safari) is handed the dart2js build from the same
      # folder. Same game either way.
      #
      # --no-web-resources-cdn bundles the renderer with the build instead of
      # fetching it from gstatic: the game works on a connection that cannot
      # reach Google's CDN.
      #
      # The same files are served from two places — GitHub Pages at
      # /waraya/play/ and Cloudflare Pages at /play/ — so the one absolute
      # path Flutter writes, <base href="/">, is made relative: "./" finds
      # the files from either. (The game routes with the URL's #, so a
      # relative base costs nothing.) Tried: the build starts from a nested
      # folder in Chromium, with no file missing.
      # WARAYA_BUILD stamps the game with the commit it is built from, and
      # latest.json below says which commit is live — the game compares the
      # two and offers a reload when they differ (lib/update/).
      - run: >
          flutter build web
          -t lib/main_levels.dart
          --release
          --wasm
          --no-web-resources-cdn
          --dart-define=WARAYA_BUILD=${{ github.sha }}

      - run: >
          flutter build web
          -t lib/main_lab.dart
          --release
          --wasm
          --no-web-resources-cdn
          --dart-define=WARAYA_LEVELS=bundled
          --output build/web-lab

      - name: Assemble the site
        run: |
          mkdir -p _site/play _site/lab
          cp -r site/. _site/
          rm -f _site/README.md
          cp -r build/web/. _site/play/
          cp -r build/web-lab/. _site/lab/
          for page in _site/play/index.html _site/lab/index.html; do
            sed -i 's|<base href="/">|<base href="./">|' "$page"
            grep -q '<base href="./">' "$page"
          done
          # What is live, for the game's update card: the version, the notes
          # (written, or made from the commits), the recent commits, and the
          # one the game under play/ was built from. Not play/version.json —
          # that one is Flutter's own.
          tool/latest_json.sh _site/latest.json --build "${{ github.sha }}"
          # Unlinked is not hidden; this at least keeps it out of search.
          sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex">|' _site/lab/index.html
          grep -q 'name="robots"' _site/lab/index.html

      # The same site on Cloudflare Pages, when its secrets are there:
      # brotli rather than gzip, a data centre in Cairo, and the headers in
      # site/_headers, which let the WebAssembly renderer draw on several
      # threads (measured: 60 fps against 15 on the same machine). GitHub
      # Pages keeps being published either way.
      #
      # Needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; the project is
      # "waraya", or the CLOUDFLARE_PAGES_PROJECT variable. Made on the
      # first deploy if it does not exist.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'waraya' }}
          WRANGLER: wrangler@4.147.0
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::no CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets: not publishing to Cloudflare Pages"
            exit 0
          fi
          npx --yes "$WRANGLER" pages project list | grep -qw "$PROJECT" \
            || npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch main
          npx --yes "$WRANGLER" pages deploy _site \
            --project-name "$PROJECT" --branch main --commit-hash "$GITHUB_SHA"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
