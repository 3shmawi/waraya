# Builds the game for every platform a runner can build it on, and puts the
# builds on a GitHub Release — the page the landing page's download link
# points at (https://github.com/3shmawi/waraya/releases/latest).
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag has to match `version:` in pubspec.yaml (the part before the +), or
# nothing is built: a release called v1.1.0 whose app says 1.0.0 is two
# numbers for one thing. Run by hand (workflow_dispatch) it builds everything
# and uploads the builds as workflow artifacts, with no release — a dry run.
#
# What each build is, and is not (docs/phase-10-release.md has the why):
# - Android: an APK to sideload and an AAB for Google Play. Signed with the
#   upload key when the four ANDROID_* secrets exist; with the debug key when
#   they do not, which installs fine and which Play refuses.
# - Windows, Linux: the release bundle, zipped. Unsigned — Windows SmartScreen
#   warns on first run.
# - macOS: the .app, zipped. Unsigned and not notarised — Gatekeeper blocks a
#   double-click; right-click → Open once gets past it.
# - iOS: not on the release page — an .ipa nobody can install is not a
#   release. It goes to TestFlight instead (below).
# - Web: not built here. pages.yml publishes it on every push to main.
#
# Every build is `lib/main.dart`, which is the campaign;
# test/app/entry_point_test.dart is what keeps that true.
#
# And the stores, on every tag (or a by-hand run with "upload" ticked):
# - the AAB goes to Google Play's internal testing track;
# - an iOS build goes to TestFlight, straight to the internal testers, and
#   through Beta App Review to the external group.
# Each one runs only when its secrets exist, so the workflow works before
# the stores are set up and each store can be added on its own. Production
# is never touched from here: that is .github/workflows/store.yml, by hand,
# after the testers have played it. The lanes are in fastlane/Fastfile, and
# docs/phase-10-release.md section 3 says how to make every secret.
#
# The build number is this workflow's run number, for Android and iOS
# alike. Both stores refuse a number they have seen before and want a later
# upload to have a bigger one, and a run number only grows — so nobody has
# to remember to bump the "+N" in pubspec.yaml, and an upload cannot fail
# for having forgotten.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload:
        description: Also upload to Play internal testing and TestFlight
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Same pin as ci.yml, pages.yml and .fvmrc.
  FLUTTER_VERSION: 3.44.9
  # fastlane refuses to run under a non-UTF-8 locale, which is what a fresh
  # runner has; and it checks for its own updates on every start otherwise.
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  FASTLANE_SKIP_UPDATE_CHECK: '1'

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      build: ${{ steps.read.outputs.build }}
      play: ${{ steps.stores.outputs.play }}
      apple: ${{ steps.stores.outputs.apple }}
      notarize: ${{ steps.stores.outputs.notarize }}
      itch: ${{ steps.stores.outputs.itch }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME but pubspec.yaml says $version"
            exit 1
          fi

      # Which stores to upload to: those whose secrets are all there, and
      # only on a tag or when asked. A job's own `if` cannot see secrets,
      # which is why this is worked out here and handed on.
      - id: stores
        env:
          WANT: ${{ github.ref_type == 'tag' || inputs.upload }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
          APPLE: >-
            ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != ''
            && secrets.ASC_KEY_P8_BASE64 != ''
            && secrets.IOS_CERTIFICATE_P12_BASE64 != ''
            && secrets.IOS_CERTIFICATE_PASSWORD != ''
            && (vars.APPLE_TEAM_ID != '' || secrets.APPLE_TEAM_ID != '') }}
          NOTARIZE: >-
            ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 != ''
            && secrets.MACOS_DEVELOPER_ID_P12_PASSWORD != ''
            && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != ''
            && secrets.ASC_KEY_P8_BASE64 != '' }}
          ITCH: ${{ secrets.BUTLER_API_KEY != '' && vars.ITCH_PROJECT != '' }}
        run: |
          # Notarizing is not uploading anywhere — it only makes the macOS
          # build open without a warning — so it happens on every run that
          # can, dry runs included.
          notarize=$NOTARIZE
          [ "$notarize" = true ] || echo "::notice::no Developer ID certificate: the macOS build is not notarized"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
          itch=false
          play=false; apple=false
          if [ "$WANT" = true ]; then
            if [ "$PLAY" = true ]; then play=true; else
              echo "::notice::no PLAY_SERVICE_ACCOUNT_JSON secret: not uploading to Play"; fi
            if [ "$APPLE" = true ]; then apple=true; else
              echo "::notice::App Store secrets or APPLE_TEAM_ID missing: not uploading to TestFlight"; fi
            if [ "$ITCH" = true ]; then itch=true; else
              echo "::notice::no BUTLER_API_KEY secret or ITCH_PROJECT variable: not uploading to itch.io"; fi
          fi
          echo "itch=$itch" >> "$GITHUB_OUTPUT"
          echo "play=$play" >> "$GITHUB_OUTPUT"
          echo "apple=$apple" >> "$GITHUB_OUTPUT"

  # The tests run before anything is built. A tag is a promise that the
  # recorded solutions still solve and the wrong ideas still fail.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: [version, checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # The keystore exists on disk for the length of this job and nowhere
      # else. android/app/build.gradle.kts signs with it when
      # android/key.properties names one, and with the debug key otherwise.
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: signing with the debug key, which Google Play refuses"
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter build apk --release --build-number=${{ needs.version.outputs.build }}
      - run: flutter build appbundle --release --build-number=${{ needs.version.outputs.build }}
      - run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/waraya-${{ needs.version.outputs.version }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "out/waraya-${{ needs.version.outputs.version }}.aab"
      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: out/

  linux:
    needs: [version, checks]
    # Every Linux job in these workflows is pinned to ubuntu-24.04 rather
    # than ubuntu-latest, which moves to a new release on its own (the next
    # one from 19 October 2026) — and this one most of all: the toolchain
    # below names package versions (libstdc++-12-dev). Moving to a newer
    # Ubuntu is a one-line change, made when someone chooses to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        # GTK for the window, GStreamer for audioplayers.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --build-number=${{ needs.version.outputs.build }}
      - run: |
          mkdir -p out
          tar -C build/linux/x64/release/bundle -czf \
            "out/waraya-${{ needs.version.outputs.version }}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: out/

  windows:
    needs: [version, checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ needs.version.outputs.build }}
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "out/waraya-${{ needs.version.outputs.version }}-windows-x64.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: out/

  macos:
    needs: [version, checks]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --build-number=${{ needs.version.outputs.build }}
      # Signed with the Developer ID certificate and notarized by Apple when
      # the secrets are there (tools/notarize_macos.sh), so it opens on a
      # double click; unsigned otherwise, and it still opens, after
      # right-click -> Open. ditto, not zip, either way: it keeps the
      # bundle's symlinks and extended attributes, and a .app zipped without
      # them does not open.
      - name: Notarize
        if: needs.version.outputs.notarize == 'true'
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: >
          tools/notarize_macos.sh
          build/macos/Build/Products/Release/waraya.app
          "out/waraya-${{ needs.version.outputs.version }}-macos.zip"
      - name: Zip, unsigned
        if: needs.version.outputs.notarize != 'true'
        run: |
          mkdir -p out
          ditto -c -k --keepParent build/macos/Build/Products/Release/waraya.app \
            "out/waraya-${{ needs.version.outputs.version }}-macos.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: out/

  play-internal:
    needs: [version, android]
    if: needs.version.outputs.play == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The AAB the android job built and the tests ran before — not a
      # second build of the same commit.
      - uses: actions/download-artifact@v7
        with:
          name: android
          path: out
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install fastlane --no-document --version 2.240.1
      - env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: fastlane android internal aab:"out/waraya-${{ needs.version.outputs.version }}.aab"

  # Apple refuses new builds for a version it has already approved — but
  # only at the very end, after the build and the signing on a macOS runner.
  # Asking first costs a minute on Linux and says what to do about it.
  app-store-version:
    needs: [version]
    if: needs.version.outputs.apple == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install fastlane --no-document --version 2.240.1
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: fastlane ios check_version version:"${{ needs.version.outputs.version }}"

  testflight:
    needs: [version, checks, app-store-version]
    if: needs.version.outputs.apple == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Builds the app unsigned, with this run's build number, and writes
      # the Podfile and the generated config the Xcode archive reads. The
      # signing is fastlane's, next.
      - run: >
          flutter build ios --release --no-codesign
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install fastlane --no-document --version 2.240.1
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          # A variable or a secret: it is not secret, but either works.
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          export IOS_CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$IOS_CERTIFICATE_PATH"
          fastlane ios beta
          rm -f "$IOS_CERTIFICATE_PATH"

  # The same build, to the external testers. A job of its own, on Linux:
  # it mostly waits — for Apple to finish processing the upload, ten to
  # thirty minutes — and a waiting macOS runner is the expensive kind. Each
  # build goes through Beta App Review before the group gets it (about a
  # day the first time, usually hours after that), and the testers are
  # notified when it does. The group's name is the repository variable
  # TESTFLIGHT_EXTERNAL_GROUP, "Mohager External" if it is not set; the
  # "what to test" text is fastlane/what_to_test.txt.
  testflight-external:
    needs: [version, testflight]
    if: needs.version.outputs.apple == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install fastlane --no-document --version 2.240.1
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          TESTFLIGHT_EXTERNAL_GROUP: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP || 'Mohager External' }}
        run: >
          fastlane ios external
          version:"${{ needs.version.outputs.version }}"
          build:"${{ needs.version.outputs.build }}"

  # Every platform to itch.io, each on its own channel: the three desktop
  # builds this run made (the very files on the GitHub Release), and the web
  # version, built here, to play in the browser on the itch.io page. butler,
  # itch.io's uploader, sends only what changed since the last push, and the
  # page shows each channel's version as "1.0.1 (42)".
  #
  # Needs the BUTLER_API_KEY secret and the ITCH_PROJECT variable, which is
  # "<itch.io user>/<game page>" from the page's address. Channel names say
  # the platform — windows, mac, linux — so itch.io tags each download by
  # itself. The web one ("html5") has to be marked "played in the browser"
  # once, by hand, on the page's edit screen.
  itch:
    needs: [version, linux, windows, macos]
    if: needs.version.outputs.itch == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The campaign (lib/main.dart). itch.io serves the game from a folder of
      # its own choosing inside an iframe, so the one absolute path Flutter
      # writes — <base href="/"> — is made relative: "./" finds the files
      # wherever the folder is. --no-web-resources-cdn keeps CanvasKit in the
      # upload, so nothing is fetched from anywhere but itch.io.
      - run: flutter build web --release --no-web-resources-cdn
      - run: |
          sed -i 's|<base href="/">|<base href="./">|' build/web/index.html
          grep -q '<base href="./">' build/web/index.html

      # The three desktop builds; not the 70 MB Android one.
      - uses: actions/download-artifact@v7
        with:
          pattern: '{windows,macos,linux}'
          path: dl
          merge-multiple: true
      # Unpacked, so butler can send only the files that changed. unzip, not
      # a library: it restores the symlinks inside the macOS app's
      # frameworks, which the app does not open without.
      - name: Unpack
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p itch/windows itch/mac itch/linux
          unzip -q "dl/waraya-$V-windows-x64.zip" -d itch/windows
          unzip -q "dl/waraya-$V-macos.zip" -d itch/mac
          tar -xzf "dl/waraya-$V-linux-x64.tar.gz" -C itch/linux
          cp -R build/web itch/html5
          find itch -maxdepth 2

      # The latest butler, not a pinned one: itch.io's API moves with it, and
      # it says which version it is in the log.
      - name: butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler -V

      - name: Push
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          PROJECT: ${{ vars.ITCH_PROJECT }}
          USERVERSION: ${{ needs.version.outputs.version }} (${{ needs.version.outputs.build }})
        run: |
          for channel in windows mac linux html5; do
            butler/butler push "itch/$channel" "$PROJECT:$channel" --userversion "$USERVERSION"
          done

  release:
    if: github.ref_type == 'tag'
    needs: [version, android, linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: ورايا ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: out/*
          body: |
            **Play in the browser, no install:** https://3shmawi.github.io/waraya/play/

            - **Android:** the `.apk` installs directly (allow installs from this source when asked). The `.aab` is for Google Play.
            - **Windows:** unzip and run `waraya.exe`. SmartScreen warns on first run: the build is not signed.
            - **macOS:** unzip and open `waraya.app`. If macOS says it cannot check the developer, right-click → Open once.
            - **Linux:** untar and run `./waraya`.

            What the game sends, and does not: https://3shmawi.github.io/waraya/privacy.html
