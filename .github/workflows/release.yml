# Builds the game for every platform a runner can build it on, and puts the
# builds on a GitHub Release — the page the landing page's download link
# points at (https://github.com/3shmawi/waraya/releases/latest).
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag has to match `version:` in pubspec.yaml (the part before the +), or
# nothing is built: a release called v1.1.0 whose app says 1.0.0 is two
# numbers for one thing. Run by hand (workflow_dispatch) it builds everything
# and uploads the builds as workflow artifacts, with no release — a dry run.
#
# What each build is, and is not (docs/phase-10-release.md has the why):
# - Android: an APK to sideload and an AAB for Google Play. Signed with the
#   upload key when the four ANDROID_* secrets exist; with the debug key when
#   they do not, which installs fine and which Play refuses.
# - Windows, Linux: the release bundle, zipped. Unsigned — Windows SmartScreen
#   warns on first run.
# - macOS: the .app, zipped. Unsigned and not notarised — Gatekeeper blocks a
#   double-click; right-click → Open once gets past it.
# - iOS: not on the release page — an .ipa nobody can install is not a
#   release. It goes to TestFlight instead (below).
# - Web: not built here. pages.yml publishes it on every push to main.
#
# Every build is `lib/main.dart`, which is the campaign;
# test/app/entry_point_test.dart is what keeps that true.
#
# And the stores, on every tag (or a by-hand run with "upload" ticked):
# - the AAB goes to Google Play's internal testing track;
# - an iOS build goes to TestFlight.
# Each one runs only when its secrets exist, so the workflow works before
# the stores are set up and each store can be added on its own. Production
# is never touched from here: that is .github/workflows/store.yml, by hand,
# after the testers have played it. The lanes are in fastlane/Fastfile, and
# docs/phase-10-release.md section 3 says how to make every secret.
#
# The build number is this workflow's run number, for Android and iOS
# alike. Both stores refuse a number they have seen before and want a later
# upload to have a bigger one, and a run number only grows — so nobody has
# to remember to bump the "+N" in pubspec.yaml, and an upload cannot fail
# for having forgotten.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload:
        description: Also upload to Play internal testing and TestFlight
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Same pin as ci.yml, pages.yml and .fvmrc.
  FLUTTER_VERSION: 3.44.9
  # fastlane refuses to run under a non-UTF-8 locale, which is what a fresh
  # runner has; and it checks for its own updates on every start otherwise.
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  FASTLANE_SKIP_UPDATE_CHECK: '1'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      build: ${{ steps.read.outputs.build }}
      play: ${{ steps.stores.outputs.play }}
      apple: ${{ steps.stores.outputs.apple }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME but pubspec.yaml says $version"
            exit 1
          fi

      # Which stores to upload to: those whose secrets are all there, and
      # only on a tag or when asked. A job's own `if` cannot see secrets,
      # which is why this is worked out here and handed on.
      - id: stores
        env:
          WANT: ${{ github.ref_type == 'tag' || inputs.upload }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
          APPLE: >-
            ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != ''
            && secrets.ASC_KEY_P8_BASE64 != ''
            && secrets.IOS_CERTIFICATE_P12_BASE64 != ''
            && secrets.IOS_CERTIFICATE_PASSWORD != ''
            && vars.APPLE_TEAM_ID != '' }}
        run: |
          play=false; apple=false
          if [ "$WANT" = true ]; then
            if [ "$PLAY" = true ]; then play=true; else
              echo "::notice::no PLAY_SERVICE_ACCOUNT_JSON secret: not uploading to Play"; fi
            if [ "$APPLE" = true ]; then apple=true; else
              echo "::notice::App Store secrets or APPLE_TEAM_ID missing: not uploading to TestFlight"; fi
          fi
          echo "play=$play" >> "$GITHUB_OUTPUT"
          echo "apple=$apple" >> "$GITHUB_OUTPUT"

  # The tests run before anything is built. A tag is a promise that the
  # recorded solutions still solve and the wrong ideas still fail.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # The keystore exists on disk for the length of this job and nowhere
      # else. android/app/build.gradle.kts signs with it when
      # android/key.properties names one, and with the debug key otherwise.
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: signing with the debug key, which Google Play refuses"
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter build apk --release --build-number=${{ needs.version.outputs.build }}
      - run: flutter build appbundle --release --build-number=${{ needs.version.outputs.build }}
      - run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/waraya-${{ needs.version.outputs.version }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "out/waraya-${{ needs.version.outputs.version }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/

  linux:
    needs: [version, checks]
    # Pinned rather than ubuntu-latest: the toolchain below names package
    # versions (libstdc++-12-dev), and ubuntu-latest moves to a new release
    # on its own — the next one from 19 October 2026.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        # GTK for the window, GStreamer for audioplayers.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: |
          mkdir -p out
          tar -C build/linux/x64/release/bundle -czf \
            "out/waraya-${{ needs.version.outputs.version }}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/

  windows:
    needs: [version, checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "out/waraya-${{ needs.version.outputs.version }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  macos:
    needs: [version, checks]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      # ditto, not zip: it keeps the bundle's symlinks and extended
      # attributes, and a .app zipped without them does not open.
      - run: |
          mkdir -p out
          ditto -c -k --keepParent build/macos/Build/Products/Release/waraya.app \
            "out/waraya-${{ needs.version.outputs.version }}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/

  play-internal:
    needs: [version, android]
    if: needs.version.outputs.play == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The AAB the android job built and the tests ran before — not a
      # second build of the same commit.
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: out
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install fastlane --no-document --version 2.240.1
      - env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: fastlane android internal aab:"out/waraya-${{ needs.version.outputs.version }}.aab"

  testflight:
    needs: [version, checks]
    if: needs.version.outputs.apple == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Builds the app unsigned, with this run's build number, and writes
      # the Podfile and the generated config the Xcode archive reads. The
      # signing is fastlane's, next.
      - run: >
          flutter build ios --release --no-codesign
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ needs.version.outputs.build }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install fastlane --no-document --version 2.240.1
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          export IOS_CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$IOS_CERTIFICATE_PATH"
          fastlane ios beta
          rm -f "$IOS_CERTIFICATE_PATH"

  release:
    if: github.ref_type == 'tag'
    needs: [version, android, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ورايا ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: out/*
          body: |
            **Play in the browser, no install:** https://3shmawi.github.io/waraya/play/

            - **Android:** the `.apk` installs directly (allow installs from this source when asked). The `.aab` is for Google Play.
            - **Windows:** unzip and run `waraya.exe`. SmartScreen warns on first run: the build is not signed.
            - **macOS:** unzip, then right-click `waraya.app` → Open the first time. The build is not notarised.
            - **Linux:** untar and run `./waraya`.

            What the game sends, and does not: https://3shmawi.github.io/waraya/privacy.html
