<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!--
  Every still layer of the launch video, drawn by a browser — a browser is
  what joins Arabic letters properly; ffmpeg's drawtext does not. render.js
  calls window.layer(spec) and saves the frame as a PNG (transparent where
  the layer is), and build.py stacks them over the gameplay with ffmpeg:

    base     the sky and the ground, and the phone's shadow   (opaque)
    chrome   the phone: bezel with the screen cut out, and the game's own
             touch controls drawn on the glass                (transparent)
    caption  the words above and below the phone              (transparent)
    end      the last card, the whole frame                   (opaque)
-->
<style>
  @font-face { font-family: 'Cairo'; src: url('../../assets/fonts/Cairo-Regular.ttf'); }
  html, body { margin: 0; background: transparent; }
  body { font-family: 'Cairo', sans-serif; }
  #frame { position: relative; overflow: hidden; }
  .abs { position: absolute; }

  .band { position: absolute; left: 0; right: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; text-align: center; padding: 0 64px; box-sizing: border-box; }
  .top .big { font-size: var(--big); line-height: 1.18; color: #14100A; font-weight: 700; }
  .top .small { font-size: var(--small); line-height: 1.35; color: #3A2408; margin-top: 8px; }
  .bottom .big { font-size: var(--mid); line-height: 1.3; color: #FFE7B0; }
  .bottom .small { font-size: var(--small); line-height: 1.4; color: #D9C2A0; margin-top: 6px; }
  .ghost { color: #DCE4EE; }
  .chip { display: inline-block; background: #14100A; color: #FFE7B0; border-radius: 22px; padding: 0 26px; }
  .ring { position: absolute; border: 7px solid #DCE4EE; border-radius: 50%;
          box-shadow: 0 0 0 6px rgba(20,16,10,.55), 0 0 30px rgba(220,228,238,.8); }

  .platforms { display: flex; gap: 22px; justify-content: center; margin-top: 18px; }
  .platform { display: flex; flex-direction: column; align-items: center; gap: 6px;
              background: rgba(255,231,176,.1); border: 2px solid rgba(255,231,176,.35);
              border-radius: 26px; padding: 16px 22px; min-width: 250px; }
  .platform svg { width: 84px; height: 84px; }
  .platform b { font-weight: 400; font-size: 44px; color: #FFE7B0; }
  .platform span { font-family: system-ui, sans-serif; font-size: 25px; color: #D9C2A0; direction: ltr; }

  .end { position: absolute; inset: 0; text-align: center;
         background: linear-gradient(#F7C032, #E59D00 calc(var(--horizon) - 1px), #D9A25C var(--horizon),
                     #0E0A10 calc(var(--horizon) + 6px)); }
  .end .head { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .end .mark { width: var(--mark); height: var(--mark); border-radius: 22%; box-shadow: 0 18px 50px rgba(20,10,0,.35); }
  .end h1 { margin: 10px 0 0; font-size: var(--title); font-weight: 400; line-height: 1.1; color: #14100A; }
  .end .tag { font-size: var(--small); color: #2A1A06; }
  .end .lower { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .end .cta { font-size: var(--mid); color: #FFE7B0; }
  .end .stores { display: flex; gap: 22px; direction: ltr; }
  .end .store { font-family: system-ui, sans-serif; font-size: 40px; color: #0E0A10; background: #FFE7B0;
                border-radius: 999px; padding: 14px 38px; }
  .end .also { font-size: 36px; color: #D9C2A0; }
  .end .url { font-family: system-ui, sans-serif; font-size: 40px; color: #D9A25C; direction: ltr; }
</style>
</head>
<body>
<div id="frame"></div>
<script>
  // The game's own controls, as they sit on a phone on its side
  // (lib/input/touch_input_source.dart and lib/ui/top_bar.dart), in that
  // screen's logical pixels; scaled onto the drawn screen.
  function controls(s) {
    const W = 844, H = 390, k = s.w / W;
    const c = (x, y, r, inner) => `<div class="abs" style="left:${(x - r) * k}px;top:${(y - r) * k}px;
      width:${2 * r * k}px;height:${2 * r * k}px;border-radius:50%;background:rgba(20,14,8,.18);
      border:${1.6 * k}px solid rgba(255,231,176,.35);box-sizing:border-box;display:flex;align-items:center;justify-content:center">${inner || ''}</div>`;
    const tri = (dir, size) => {
      const t = { up: 'border-bottom', down: 'border-top', left: 'border-right', right: 'border-left' }[dir];
      const side = (dir === 'up' || dir === 'down') ? ['border-left', 'border-right'] : ['border-top', 'border-bottom'];
      return `<div style="width:0;height:0;${t}:${size * k}px solid rgba(255,231,176,.85);${side[0]}:${size * 0.85 * k}px solid transparent;${side[1]}:${size * 0.85 * k}px solid transparent"></div>`;
    };
    const pad = 54, px = 26 + 34 + pad, py = H - 26 - pad;
    let html = c(px, py, pad, `<div style="display:flex;gap:${30 * k}px;align-items:center">${tri('left', 10)}<div style="width:${23 * k}px;height:${23 * k}px;border-radius:50%;background:rgba(20,14,8,.25)"></div>${tri('right', 10)}</div>`);
    const jx = W - 26 - 46, jy = H - 26 - 46;
    html += c(jx, jy, 46, tri('up', 12));
    html += c(jx - 100, jy + 10, 36, tri('down', 10));
    // The bar: language, retry, levels, pause.
    const icons = ['EN', '⟲', '☰', 'II'];
    icons.forEach((g, i) => {
      const x = W - 10 - 20 - i * 48, y = 10 + 20;
      html += c(x, y, 20, `<span style="font-family:system-ui;font-size:${13 * k}px;color:rgba(255,231,176,.9)">${icons[icons.length - 1 - i]}</span>`);
    });
    return html;
  }

  const phoneSvg = `<svg viewBox="0 0 84 84"><rect x="12" y="24" width="60" height="36" rx="7" fill="none" stroke="#FFE7B0" stroke-width="4"/><circle cx="18" cy="42" r="2.4" fill="#FFE7B0"/></svg>`;
  const laptopSvg = `<svg viewBox="0 0 84 84"><rect x="16" y="20" width="52" height="34" rx="4" fill="none" stroke="#FFE7B0" stroke-width="4"/><path d="M8 62 H76" stroke="#FFE7B0" stroke-width="5" stroke-linecap="round"/></svg>`;
  const browserSvg = `<svg viewBox="0 0 84 84"><rect x="12" y="18" width="60" height="48" rx="6" fill="none" stroke="#FFE7B0" stroke-width="4"/><path d="M12 30 H72" stroke="#FFE7B0" stroke-width="4"/><circle cx="20" cy="24" r="2" fill="#FFE7B0"/><circle cx="27" cy="24" r="2" fill="#FFE7B0"/></svg>`;

  window.layer = (spec) => {
    const L = spec.layout, f = document.getElementById('frame');
    f.style.width = L.W + 'px'; f.style.height = L.H + 'px';
    for (const [k, v] of Object.entries(L.type)) f.style.setProperty('--' + k, v + 'px');
    const s = L.screen, b = L.bezel;
    let html = '';
    if (spec.kind === 'base') {
      html = `<div class="abs" style="inset:0;background:linear-gradient(#F7C032, #E59D00 ${L.horizon - 1}px, #D9A25C ${L.horizon}px, #0E0A10 ${L.horizon + 6}px)"></div>
        <div class="abs" style="left:${s.x - b}px;top:${s.y - b}px;width:${s.w + 2 * b}px;height:${s.h + 2 * b}px;border-radius:${b + 26}px;box-shadow:0 30px 70px rgba(10,5,0,.55), 0 0 0 2px rgba(255,231,176,.2)"></div>`;
    } else if (spec.kind === 'chrome') {
      // A bezel: one rounded rectangle with the screen punched out of it
      // by a huge outline, so the gameplay underneath gets round corners.
      html = `<div class="abs" style="left:${s.x - b}px;top:${s.y - b}px;width:${s.w + 2 * b}px;height:${s.h + 2 * b}px;border-radius:${b + 26}px;overflow:hidden">
          <div class="abs" style="left:${b}px;top:${b}px;width:${s.w}px;height:${s.h}px;border-radius:26px;box-shadow:0 0 0 ${b + 4}px #0B0A0C"></div>
          <div class="abs" style="left:${b * 0.42}px;top:${b + s.h / 2 - 7}px;width:14px;height:14px;border-radius:50%;background:#1E1C22"></div>
          <div class="abs" style="inset:0;border-radius:${b + 26}px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)"></div>
        </div>
        <div class="abs" style="left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px;border-radius:26px;overflow:hidden">${controls(s)}</div>`;
    } else if (spec.kind === 'caption') {
      const c = spec.card;
      if (c.top_big || c.top_small) {
        html += `<div class="band top" style="top:${L.topBand[0]}px;height:${L.topBand[1] - L.topBand[0]}px">
          ${c.top_big ? `<div class="big">${c.top_big}</div>` : ''}${c.top_small ? `<div class="small">${c.top_small}</div>` : ''}</div>`;
      }
      if (c.bottom_big || c.bottom_small || c.platforms) {
        html += `<div class="band bottom" style="top:${L.bottomBand[0]}px;height:${L.bottomBand[1] - L.bottomBand[0]}px">
          ${c.bottom_big ? `<div class="big">${c.bottom_big}</div>` : ''}${c.bottom_small ? `<div class="small">${c.bottom_small}</div>` : ''}
          ${c.platforms ? `<div class="platforms">
              <div class="platform">${phoneSvg}<b>موبايل</b><span>Android · iPhone</span></div>
              <div class="platform">${laptopSvg}<b>كمبيوتر</b><span>Windows · Mac · Linux</span></div>
              <div class="platform">${browserSvg}<b>المتصفح</b><span>بدون تحميل</span></div>
            </div>` : ''}</div>`;
      }
      if (c.ring) {
        // In the game screen's own pixels (844 x 390), so a ring can be
        // put on a body read off a frame.
        const k = s.w / 844, r = c.ring.r * k;
        html += `<div class="ring" style="left:${s.x + c.ring.x * k - r}px;top:${s.y + c.ring.y * k - r}px;width:${2 * r}px;height:${2 * r}px"></div>`;
      }
    } else if (spec.kind === 'end') {
      const c = spec.card;
      html = `<div class="end" style="--horizon:${L.endHorizon}px">
        <div class="head" style="top:${L.endHead}px">
          <img class="mark" src="../../store/play-icon-512.png">
          <h1>ورايا</h1>
          <div class="tag">${c.tag}</div>
        </div>
        <div class="lower" style="top:${L.endHorizon + L.endGap}px">
          <div class="cta">${c.cta}</div>
          <div class="stores"><span class="store">Google Play</span><span class="store">App Store</span></div>
          <div class="also">${c.also}</div>
          <div class="url">waraya.pages.dev</div>
        </div>
      </div>`;
    }
    f.innerHTML = html;
    return document.fonts.ready.then(() => Promise.all(
      [...f.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = r; i.onerror = r; }))));
  };
</script>
</body>
</html>
