<!--
  Where the QR code at the end of the launch video goes
  (docs/marketing/launch-video.md). One code for every phone: an Android
  goes straight to Google Play, an iPhone or iPad straight to the App Store,
  and anything else — a computer, or a phone this cannot tell — stays here
  and picks. Nothing is recorded; it reads the user agent and moves on.
-->
<script>
  (function () {
    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/.test(ua) ||
      (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);   // iPadOS says Mac
    if (/Android/i.test(ua)) {
      location.replace('https://play.google.com/store/apps/details?id=com.mohager.waraya');
    } else if (ios) {
      location.replace('https://apps.apple.com/app/id6818521154');
    }
  })();
</script>
