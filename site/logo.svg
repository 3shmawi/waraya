<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="waraya">
  <title>waraya</title>
  <defs>
    <!-- The same stops as the in-game sky (lib/game/sky_backdrop.dart),
         sampled from the dust-storm photograph the scenery was cut from. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C032"/>
      <stop offset="0.62" stop-color="#E59D00"/>
      <stop offset="1" stop-color="#D28C02"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="100" height="100" rx="22"/>
    </clipPath>

    <!-- One body, mid-stride, walking left. Proportions are the game's own
         (lib/game/character/figure.dart): hip at 0.46 of the body, shoulder
         at 0.79, head at 0.90 with a radius of 0.072, trunk tilted into the
         direction of travel. Drawn in currentColor so each copy can be a
         different one. -->
    <g id="body" fill="currentColor" stroke="currentColor"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M-4.5 53.3 L4.5 51.1 L1.2 32.8 L-10.4 35.8 Z" stroke-width="1.2"/>
      <path d="M-5.1 32.1 L-6.1 28.4" stroke-width="3.4"/>
      <circle cx="-6.1" cy="28.4" r="4.3" stroke="none"/>
      <path d="M0 52.2 L-7 65 L-10 78" fill="none" stroke-width="3.8"/>
      <path d="M0 52.2 L5.5 65.5 L10.5 74.5" fill="none" stroke-width="3.8"/>
      <path d="M-4.6 34.3 L-10.5 43 L-13.5 50.5" fill="none" stroke-width="3.2"/>
      <path d="M-4.6 34.3 L2 43.5 L6 50.5" fill="none" stroke-width="3.2"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="100" height="100" fill="url(#sky)"/>

    <!-- Where you were, and where you were before that. Pale and cold: the one
         colour this scene does not have, so the echo never disappears into the
         sunset the way a darker one would. -->
    <use href="#body" x="66.5" color="#DCE4EE" opacity="0.30"/>
    <use href="#body" x="53.5" color="#DCE4EE" opacity="0.55"/>
    <!-- And where you are. -->
    <use href="#body" x="40.5" color="#07050A"/>

    <!-- The ground all three are walking on, lit along its top edge. -->
    <rect x="0" y="78" width="100" height="22" fill="#0E0A10"/>
    <rect x="0" y="78" width="100" height="1.6" fill="#D9A25C"/>
  </g>
</svg>
